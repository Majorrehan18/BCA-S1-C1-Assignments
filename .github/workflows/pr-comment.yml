name: Auto Comment on PR Submission

# 1. Trigger the workflow when a pull request is opened
on:
  pull_request:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    
    # 2. Grant permissions to write comments on the pull request
    permissions:
      pull-requests: write

    steps:
      # 3. Post the assignment submission message
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Your Assignment is Submitted"
            })
